apiVersion: 1

contactPoints:
  - orgId: 1
    name: local-webhook
    receivers:
      - uid: local-webhook-receiver
        type: webhook
        settings:
          url: http://host.docker.internal:9999/alert
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: local-webhook
    group_by: [alertname, severity]
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      - receiver: local-webhook
        matchers:
          - severity = critical
        group_wait: 0s
        repeat_interval: 15m

groups:
  - orgId: 1
    name: payshield_alerts
    folder: PayShield
    interval: 1m
    rules:

      - uid: fraud-model-down
        title: FraudModelDown
        condition: A
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fraud model not loaded"
          description: "fraud-model-api has had no model for > 2 minutes"
        data:
          - refId: A
            datasourceUid: "-- Grafana --"
            relativeTimeRange: { from: 300, to: 0 }
            model:
              type: classic_conditions
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last }
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: model_loaded_status
              instant: true
              refId: B

      - uid: high-fraud-rate
        title: HighFraudRate
        condition: A
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fraud rate exceeding 15%"
        data:
          - refId: A
            datasourceUid: "-- Grafana --"
            relativeTimeRange: { from: 300, to: 0 }
            model:
              type: classic_conditions
              conditions:
                - evaluator: { type: gt, params: [0.15] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last }
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: "rate(fraud_predictions_total{risk_level=\"HIGH\"}[5m]) / rate(fraud_predictions_total[5m])"
              instant: true
              refId: B

      - uid: high-prediction-latency
        title: HighPredictionLatency
        condition: A
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Model p99 latency > 500ms"
        data:
          - refId: A
            datasourceUid: "-- Grafana --"
            relativeTimeRange: { from: 300, to: 0 }
            model:
              type: classic_conditions
              conditions:
                - evaluator: { type: gt, params: [500] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last }
          - refId: B
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: "histogram_quantile(0.99, rate(model_prediction_latency_ms_bucket[5m]))"
              instant: true
              refId: B
