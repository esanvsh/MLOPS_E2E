global:
  resolve_timeout: 5m

route:
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: local-webhook

  routes:
    - matchers:
        - severity = critical
      group_wait: 0s
      repeat_interval: 15m
      receiver: local-webhook

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://host.docker.internal:9999/alert
        send_resolved: true
        http_config:
          follow_redirects: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname]
